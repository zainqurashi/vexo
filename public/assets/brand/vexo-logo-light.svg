  </g>
  
  <!-- VEXO Brand Typography in Pure White -->
  <text x="56" y="34" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="5" fill="#FFFFFF">VEXO</text>
  
  <!-- Gold Accent Divider Dot -->
  <circle cx="178" cy="24" r="2.5" fill="url(#vexoGoldGradLight)"/>
  
  <!-- Subtitle Tagline -->
  <text x="57" y="47" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="3.8" fill="#D4AF37">SMART LIVING</text>
</svg>
