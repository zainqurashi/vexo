<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="vexoGoldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F1D8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  
  <!-- Monogram Glyph -->
  <g transform="translate(10, 8)">
    <polygon points="0,0 16,36 32,0 25,0 16,22 7,0" fill="url(#vexoGoldGradLight)"/>
